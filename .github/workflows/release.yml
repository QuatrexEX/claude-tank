# Build the release exe from a pushed version tag, attach a signed build
# provenance attestation, and upload it to a *draft* GitHub Release.
# The draft is published by hand after checking the attestation, so the
# in-app update check (releases/latest) never sees an unverified build.
#
# Users can confirm a download came from this repo and workflow with:
#   gh attestation verify claude-tank.exe -R QuatrexEX/claude-tank
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write          # create the draft release
      id-token: write          # mint the OIDC token for Sigstore signing
      attestations: write      # store the attestation
      artifact-metadata: write # record the attested artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches Cargo.toml
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$ver" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $ver"
          }

      # No build cache on purpose: a release build should not reuse artifacts
      # from earlier runs.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: SHA256
        id: hash
        run: |
          $h = (Get-FileHash target/release/claude-tank.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$h" >> $env:GITHUB_OUTPUT
          "SHA256: ``$h``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release/claude-tank.exe

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          $notes = "Draft built by GitHub Actions. SHA256: $env:SHA256"
          gh release create $env:GITHUB_REF_NAME target/release/claude-tank.exe `
            --repo $env:GITHUB_REPOSITORY --draft `
            --title "Claude Tank $env:GITHUB_REF_NAME" --notes $notes
